<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ptools Assembler</title>
    <link rel="stylesheet" href="style/assembler_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav id="navbar">
        <div id="nav-title">Ptools</div>

        <div id="nav-links">
            <a href="index.html">Home</a>
            <a href="assembler.html">Assembler</a>
            <a href="disassembler.html">Disassembler</a>
            <a href="ram-init.html">RAM Init</a>
        </div>
    </nav>

    <div id="app">
        <!-- Left: Assembly Input -->
        <div id="input-panel">
            <h2>Assembly Code</h2>

            <div class="input-group source-upload">
                <input
                    type="file"
                    id="assembly-file">
            </div>

            <div id="editor">
                <div id="line-numbers" aria-hidden="true">1</div>
                <textarea
                    id="assembly-input"
                    placeholder="Enter assembly code here..."
                    spellcheck="false"
                    wrap="off"></textarea>
            </div>
        </div>


        <!-- Right: Output -->
        <div id="output-panel">
            <div id="format-buttons">
                <h2>Choose output format</h2>
                <button id="format-ascii">ASCII</button>
                <button id="format-bin">BINARY</button>
                <button id="format-inter">INTERMEDIATE</button>
            </div>

            <div id="result-section">
                <h2>Output</h2>

                <div class="code-container">
                    <div class="output-actions">
                        <button class="copy-button" id="copy-output">Copy</button>
                        <button class="download-button" id="download-output">Download</button>
                    </div>

                    <pre id="assembly-result"></pre>
                </div>
            </div>

            <div id="error-section">
                <h2>Errors</h2>

                <div class="code-container">
                    <button class="copy-button" id="copy-errors">Copy</button>
                    <pre id="assembly-errors"></pre>
                </div>
            </div>
        </div>

    </div>
    <script src="./assembler_web.bc.js"></script>

</body>
</html>
