# Structure of directory public/:
# public/
#   +- tools            # contains the web versions of tools and has entrypoint in tools/index.html
#   +- gaur
#     +- index.html     # the main entrypoint for documentation, has link to tools/index.html
#   +- assembler        # documentation page for assembler
#   +- disassembler     # documentation page for disassembler
#   +- <other tools>    # documentation pages for the other tools
#   +- index.html       # main GitLab pages entrypoint -- symlinked to gaur/index.html

default:
  image: registry.gitlab.com/verify-at-iitpkd/gaur:latest

stages:
  - build           # Build the main dune project
  - test            # Run cram tests
  - web-tools       # Build pages for web versions of tools
  - documentation   # Build documentation (.html pages)
  - host-on-pages   # Host documentation and web tools on GitLab pages

build-project:
  stage: build
  script:
    - dune build
  artifacts:
    paths:
      - _build

nix-build-and-cache:
  stage: build
  image: nixos/nix:latest
  script:
    - nix-env -iA nixpkgs.cachix
    - cachix use gaur
    - nix --extra-experimental-features "nix-command flakes" build .#gaur
    - nix --extra-experimental-features "nix-command flakes" build .#web
    - |
      if [ -n "$CACHIX_AUTH_TOKEN" ]; then
        echo "Pushing build artifacts to gaur.cachix.org..."
        cachix push gaur ./result
      fi

cram-tests:
  stage: test
  dependencies:
    - build-project
  script:
    - dune runtest

build-web-tools:
  stage: web-tools
  script:
    - mkdir public
    - cp -r _build/default/web public/tools
    - cp -r ./web/pages/* public/tools
  artifacts:
    paths:
      - public

build-documentation:
  stage: documentation
  script:
    - dune build @doc
    - cp -r _build/default/_doc/_html/* public/
    - rm -f public/index.html
    - ln -s gaur/index.html public/index.html
  artifacts:
    paths:
      - public

host-web:
  stage: host-on-pages
  script:
    - echo "Hosting documentation and web tools on GitLab pages..."
  pages: true

